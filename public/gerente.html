<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerente - Pagamento de Guias</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/theme-helper.js"></script>
  <script src="/js/logo-helper.js"></script>
  <script src="/js/audio-helper.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body>
  <nav class="navbar">
    <div id="cobBrandHeader"></div>
    <div class="nav-links">
      <div id="themeToggleContainer"></div>
      <a href="/" class="nav-btn">Inicio</a>
      <a href="/advogado.html" class="nav-btn">Advogado</a>
      <a href="/contadora.html" class="nav-btn">Contadora</a>
      <a href="/gerente.html" class="nav-btn active">Gerente</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div class="page-title">
        <h1>Painel do Gerente</h1>
        <p>Acompanhe pedidos de guia, pague quando a guia estiver pronta e envie o comprovante ao advogado.</p>
      </div>
      <button type="button" class="btn btn-secondary btn-sm" onclick="loadPaymentRequests()">Atualizar</button>
    </div>

    <div class="card">
      <div class="card-title">
        <span>Guias Prontas para Pagamento</span>
      </div>
      <div id="readyPaymentRequests" style="display: flex; flex-direction: column; gap: 1rem;"></div>
    </div>

    <div class="card" style="margin-top: 1.5rem;">
      <div class="card-title">
        <span>Todas as Solicitacoes</span>
      </div>
      <div id="allPaymentRequests" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="/js/gerente.js"></script>
</body>
</html>
